<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body{
            padding-top: 50PX;
        }
        .head{
            text-align: center;
            background-color: #0041d8;
            background-image: linear-gradient(180deg, #023dc5 0%, #011535 100%);
            color:rgb(255, 255, 255);
            padding: 20px;
            margin-left: 200px;
            height: 250px;
            width: 1290px;
            border-radius: 20px;
            

        }
        .head h1{
            font-size: 70px;
        }
        .head span{
            font-size: 70px;
            color: yellow;
        }
   
        #search{
            margin-top: 30px;
            border-radius: 30px;
            width: 700px;
            height: 50px;
            padding: 20px;
            background-color: peachpuff;
            color:black;
        }
        
        #submit:hover{
            background-color: rgb(2, 160, 162);
            color:rgb(0, 0, 0);
            
        }
        #submit{
            background-color: aquamarine;
            border-radius:15px;
            border: none;
            height: 50px;
            width: 80px;

        }
        .container{
            padding-top: 20px;

        }
    </style>
</head>
<body>
    <div class="head">
        <h1>Welcome To <span><b>MyRecipe</b></span></h1>
        <input type="text" id="search" placeholder="Search for recipe">
        <button type="submit" id="submit">Search</button>
    </div>
    <div class="container">
        <div class="row" id="id1">
           
        </div>
    </div>
    <script>
        function fetchData(){
            fetch('https://www.themealdb.com/api/json/v1/1/filter.php?c=Dessert')
            .then(res =>res.json())
            .then(data => {
                let arrdata = data.meals
                let ans = ``
                for(let i=0;i<arrdata.length;i++){
                    // ans+=`<img src=${arrdata[i].strMealThumb} width="200px" height="200px">`
                    ans+=`<div class="col-md-4">
                        <div class="card">
                            <img src=${arrdata[i].strMealThumb} class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">${arrdata[i].strMeal}</h5>
                            </div>
                            </div>
                        </div>
                        `
                }
                document.getElementById('id1').innerHTML = ans
            })
        }
        fetchData()
    </script>
</body>
</html>
